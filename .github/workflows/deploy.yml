name: Build and Push to ECR

on:
  push:
    branches: [ main ]

env:
  AWS_REGION: ap-northeast-2
  ECR_REPOSITORY: project3-app

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          echo "Image pushed: $ECR_REPOSITORY:$IMAGE_TAG"

      - name: Update deployment manifest in infra repo
        env:
          GH_PAT: ${{ secrets.INFRA_REPO_TOKEN }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          git clone --depth 1 https://x-access-token:${GH_PAT}@github.com/kimuback/git-terraform-infra.git infra
          cd infra
          sed -i "s#project3-app:.*#project3-app:${IMAGE_TAG}#" 08-k8s-apps/k8s-manifests/deployment.yaml
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "deploy: image ${IMAGE_TAG}"
          git push